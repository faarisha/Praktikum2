<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Pemesanan Pizza</title>
</head>

<body>

  <div id="formSection">
    <h1>Form Pemesanan Pizza</h1>
    <p>
      Silakan isi form pemesanan ini dengan lengkap dan benar.
    </p>
    
    <form id="pizzaForm" onsubmit="showThankYou(event)">
        <fieldset>
          <legend>Informasi Pemesan</legend>
          <p>
            <label for="costomername">Nama:</label> 
            <input type="text" id="costomername" name="costomername" required>
          </p> 
          
          <p>
            <label for="address">Address:</label> 
            <input type="text" id="address" name="address" required>
          </p>
          
          <p>
            <label for="telephone">Telephone:</label> 
            <input type="text" id="telephone" name="telephone" required>
          </p>
          
          <p>
            <label for="email">Email:</label> 
            <input type="email" id="email" name="email" required>
          </p>
          
          <p> 
            <label for="instruction">Delivery instruction:</label><br> 
            <textarea
                 id="instruction"
                 name="instruction"
                 rows="4"
                 cols="50"
                 maxlength="400"
                 placeholder="no more than 400 characters"></textarea>
            </p>
        </fieldset>
        
        <fieldset>
          <legend>Design your dream pizza</legend>
          <p><strong>Pizza specs</strong></p>
          <p>Pilih salah satu</p>
          
          <p> 
              <input type="radio" id="classic-crust" name="crust" value="classic white" required>
              <label for="classic-crust">Classic white</label><br>
              
              <input type="radio" id="peperoni-crust" name="crust" value="peperoni" required>
              <label for="peperoni-crust">Peperoni</label><br>
              
              <input type="radio" id="cheese-crust" name="crust" value="cheese" required>
              <label for="cheese-crust">Cheese</label><br>
              
              <input type="radio" id="sausage-crust" name="crust" value="sausage" required>
              <label for="sausage-crust">Sausage</label><br>
          </p>
            
          <p><strong>Topping</strong></p>
           
          <p>
              <input type="checkbox" id="classic-top" name="topping" value="classic white">
              <label for="classic-top">Classic white</label><br>
              
              <input type="checkbox" id="peperoni-top" name="topping" value="peperoni">
              <label for="peperoni-top">Peperoni</label><br>
              
              <input type="checkbox" id="cheese-top" name="topping" value="cheese">
              <label for="cheese-top">Cheese</label><br>
              
              <input type="checkbox" id="sausage-top" name="topping" value="sausage">
              <label for="sausage-top">Sausage</label><br>
          </p>
            
          <p> 
              <label for="quantity">Quantity:</label>
              <select id="quantity" name="quantity" required>
                  <option value="">--pilih jumlah--</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
              </select>
          </p>
        </fieldset>
        
        <p>
            <input type="submit" value="submit">
            <input type="reset" value="reset">
        </p>
    </form>
  </div>

  <div id="thankYouCard" style="display: none; border: 2px dashed green; padding: 20px; margin-top: 20px; background-color: #e8f5e9; text-align: center; border-radius: 8px;">
    <h2> Thank You!</h2>
    <p id="thankYouText"></p>
    <button onclick="location.reload()" style="padding: 8px 15px; margin-top: 10px; cursor: pointer;">Pesan Lagi</button>
  </div>

  <script>
    function showThankYou(event) {
      event.preventDefault(); 

      var nama = document.getElementById('costomername').value;


      document.getElementById('formSection').style.display = 'none';

     
      document.getElementById('thankYouText').innerText = 'Terima kasih, ' + nama + '! Pemesanan pizza kamu berhasil dipesan dan siap dikirim.';
      

      document.getElementById('thankYouCard').style.display = 'block';
    }
  </script>

</body>

</html>
